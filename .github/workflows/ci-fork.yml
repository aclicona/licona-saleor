# CI propia del fork (aclicona/licona-saleor). NO existe en el repo upstream de Saleor.
#
# Por que un archivo nuevo y no un arreglo de `tests-and-linters.yml`:
#   1. Ese workflow NO sirve como CI de las ramas `stable/*` de este fork: solo dispara
#      con `pull_request` y con `push` a `main`, y no tiene `workflow_dispatch`, asi que
#      ni una rama `stable/*` lo dispara por push ni se puede lanzar a mano con
#      `gh workflow run`. (Una version anterior de este comentario decia que estaba en
#      `state: deleted` en la API de Actions. Falso: B-595 midio el 2026-09-26
#      `state: active`, id 340320362, y 24 registros que cuadran con el arbol; ver el
#      reporte B-595. No se re-midio al corregir esto. Que la falta de
#      `workflow_dispatch` sea la causa del `gh workflow run` fallido original es una
#      hipotesis del reporte, no medida.)
#   2. Ademas es un archivo de upstream. Tocarlo paga deuda de merge en cada sync 3.22.x.
#      Un archivo con nombre propio (`ci-fork.yml`) tiene cero conflictos por definicion.
#
# Por que hay `workflow_dispatch`: los PR que abre `sync-upstream.yml` usan
# `secrets.GITHUB_TOKEN`, y GitHub no dispara workflows con eventos originados por ese
# token (salvaguarda antibucle). Las unicas excepciones documentadas son
# `workflow_dispatch` y `repository_dispatch`. Por tanto el dispatch manual es la UNICA
# via por la que la rama de sync puede recibir CI.

name: CI del fork

# Permisos EXPLICITOS a proposito. Sin este bloque, el scope sale del ajuste de repo
# "Workflow permissions" (Settings -> Actions -> General), que NO esta versionado: hoy
# vale `write` en este fork, pero GitHub pone `read` por defecto en los repos nuevos
# desde 2023. En un repo replicado para un cliente, `actions/upload-artifact` fallaria
# con 403 y tumbaria el job `suite` ENTERO — un run donde los 17k tests pasaron se veria
# como suite fallida en el enlace que `sync-upstream.yml` pone en el cuerpo del PR.
# Es el mismo modo de fallo que ya mordio al job `sync`: permiso implicito que se rompe
# lejos y miente cerca.
permissions:
  contents: read
  actions: write   # `actions/upload-artifact@v4` lo exige

on:
  # `push` sobre `stable/*` existe porque la via de despliegue real de este fork es
  # push DIRECTO a `stable/3.23`, sin PR de por medio. Mientras todo disparara solo
  # en `pull_request`, la CI no vigilaba NADA en el unico camino que se usa: un
  # `schema.graphql` desincronizado del codigo llegaba a Railway sin que nadie mirara.
  #
  # Honestidad sobre lo que este trigger ES y lo que NO es: en `push`, `puerta` es una
  # ALARMA POST-HOC, no un gate. Railway despliega el commit en paralelo y no espera a
  # la CI; cuando el job termina, la version mala ya esta arriba. Lo que aporta es la X
  # roja en el commit y el correo al autor -- que alguien se entere en minutos, no en el
  # proximo `npm run codegen` del storefront. Un gate de verdad exigiria rama protegida
  # y PR obligatorio, y eso es otra decision, con otro coste de flujo.
  push:
    branches: [ 'stable/*' ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ 'stable/*' ]
  workflow_dispatch:
    inputs:
      alcance:
        description: 'completo = puerta + linters + suite | rapido = solo la puerta'
        type: choice
        options: [completo, rapido]
        default: completo

env:
  CACHE_URL: "redis://cache:6379/0"
  DATABASE_URL: "postgres://saleor:saleor@postgres:5432/saleor"
  SECRET_KEY: ci-test

# Agrupa por workflow + PR (o ref, cuando no hay PR). Un push nuevo cancela el anterior.
# En `push` sobre `stable/*` eso significa que dos commits seguidos dejan viva solo la
# alarma del segundo. No se pierde senal: el segundo run mide el arbol resultante, que
# sigue teniendo la deriva mientras nadie la arregle.
#
# Excepcion: el push que CREA la rama (`github.event.created`) tiene grupo propio,
# sufijo `-creacion`. Ese run es el unico en `push` que corre ademas el smoke de la
# imagen; con el grupo comun, un segundo push poco despues de crear la rama lo
# cancelaria y la verificacion completa del re-fork se perderia en silencio. Con grupo
# aparte, el run de creacion termina y los pushes posteriores se cancelan solo entre
# si. (B-666) Desde B-1005 la suite completa y desde B-1270 los linters corren en TODO
# push a `stable/*` (ver jobs `suite` y `linters`); la cancelacion entre pushes es
# aceptable: el guard exige solo el HEAD.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.created && '-creacion' || '' }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Puerta rapida: lo que un parche 3.22.x rompe de verdad contra los parches locales
  # del fork -- un import roto por un rename upstream, una migracion que falta, deriva
  # de configuracion. Corre SIEMPRE: en PR, en `alcance: rapido` y en `push`. En `push`
  # corre junto a `linters` y `suite` (B-1270, B-1005); el smoke de la imagen solo corre
  # en el push que crea la rama y en dispatch `completo` (ver sus condiciones mas abajo).
  #
  # Son SEIS parches locales, no diecinueve: `manage.py`, `saleor/asgi/__init__.py`,
  # `saleor/celeryconf.py`, `pyproject.toml`, la migracion `discount/0052` y el
  # `Dockerfile` (ver "Cuanto divergimos de upstream" en UPGRADE_NOTES.md, medido con
  # `git diff --stat`). El 19 que aparece en `sync-upstream.yml` es otra cosa: los 19
  # tags de parche de UPSTREAM que absorbio el sync de 3.22.48 a 3.22.67.
  # ---------------------------------------------------------------------------
  puerta:
    name: Puerta rapida
    runs-on: ubuntu-latest
    container: python:3.12
    timeout-minutes: 15

    services:
      # `manage.py makemigrations --check` necesita una base alcanzable.
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: saleor
          POSTGRES_USER: saleor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependencias de sistema
        run: |
          apt-get update -qq
          apt-get install -y libpq-dev jq

      # Tests de los guiones de scripts/ (sh POSIX, sin Django ni Postgres, con
      # intérpretes/`gh` falsos): sin este paso nada los corre y un refactor de un
      # guion podria romper su contrato sin que nadie lo vea (B-858). Va antes de
      # `uv sync` porque no necesita el entorno. Va DESPUÉS de las dependencias de
      # sistema porque el contenedor python:3.12 no trae `jq` (sin `apt-get update` no
      # lo encuentra) y los guiones lo usan. Un test que falla da exit != 0.
      - name: Tests de los guiones (scripts/tests)
        run: |
          set -u
          n=0
          for t in scripts/tests/test_*.sh; do
            [ -e "$t" ] || { echo "No hay tests en scripts/tests/"; exit 1; }
            echo "=== $t"
            sh "$t" || exit 1
            n=$((n + 1))
          done
          echo "$n archivos de test de guiones pasaron."

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.0.0
        with:
          enable-cache: true

      - name: Sincronizar el entorno (uv sync --locked)
        run: uv sync --locked

      - name: El proyecto importa
        run: uv run python -c "import saleor"

      - name: Ruff
        run: uv run ruff check .

      - name: Django system check
        run: uv run python manage.py check

      - name: No faltan migraciones
        run: uv run python manage.py makemigrations --check --dry-run

      # Hermano conceptual del paso de arriba: los dos preguntan si un ARTEFACTO
      # DERIVADO Y COMMITEADO sigue sincronizado con el codigo. `saleor/graphql/
      # schema.graphql` esta versionado en el fork, y el storefront Nuxt VENDORIZA esa
      # copia para generar sus tipos TypeScript. Si un parche local toca la capa GraphQL
      # y nadie regenera, el archivo miente aqui y la mentira se descubre alla: en otro
      # repo, dias despues, como un tipo que no cuadra.
      #
      # Por que aqui y no en `linters`: el hook `gql-schema-check` ya existe en
      # `.pre-commit-config.yaml`, pero (a) `linters` corre `pre-commit run --all`
      # entero -- mypy, semgrep, deptry, ~20 min de runner -- para un resultado que
      # cuesta unos 10 s, y (b) `linters` NO corre en `push`, que es justo el camino que
      # hay que cubrir. Aparte: `pre-commit install` nunca se ejecuto en este repo, asi
      # que ese hook tampoco se dispara al commitear en local. Este paso no depende de el.
      #
      # `uv run` para heredar el entorno ya sincronizado: el guion usa `${PYTHON:-python}`
      # y `uv run` deja `.venv/bin` primero en el PATH, de modo que `python` es el bueno
      # sin codificar ninguna ruta. `sh` explicito, sin depender del bit de ejecucion.
      #
      # El guion distingue tres respuestas: 0 fiel, 1 deriva real, 2 "no pude preguntar"
      # (entorno roto, Postgres caido, salida vacia). Aqui 1 y 2 fallan los dos, a
      # proposito: en CI un "no se" es rojo. Nunca escribe sobre el esquema: genera a un
      # temporal fuera del repo. Contrato completo en el encabezado del guion.
      - name: El esquema GraphQL commiteado es fiel al codigo
        run: uv run sh scripts/check-schema-fidelity.sh

  # ---------------------------------------------------------------------------
  # Linters completos via pre-commit. Corren en PR, en TODO push a `stable/*` y en
  # dispatch `completo`; solo se saltan cuando el dispatch pidio `rapido`.
  #
  # B-1270: antes el job se cortaba en `push` normal (solo corria al crear la rama), asi
  # que el aviso `[linters-fork]` del worker no podia medir el HEAD y 6 pushes quedaron
  # sin linters. B-666 (ahorro de minutos) queda superada, igual que en `suite` por
  # B-1005: el repo es publico (runners gratis) y pre-commit tarda ~5-6 min. La
  # condicion es la misma que la de `suite`.
  #
  # Sobre la condicion: en un evento `pull_request` el contexto `inputs` esta vacio,
  # asi que `inputs.alcance` es la cadena vacia y `inputs.alcance != 'rapido'` ya
  # daria true. Aun asi se antepone `github.event_name != 'workflow_dispatch'`: la
  # or corta antes de mirar `inputs` en todo evento que no sea dispatch, de modo que
  # el comportamiento en PR y en push no depende de como GitHub decida poblar (o no)
  # `inputs` en eventos donde ese contexto no aplica.
  # ---------------------------------------------------------------------------
  linters:
    name: Linters (pre-commit)
    runs-on: ubuntu-latest
    container: python:3.12
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.alcance != 'rapido' }}

    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependencias de sistema
        run: |
          apt-get install -y libpq-dev

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.0.0
        with:
          enable-cache: true

      - name: Sincronizar el entorno (uv sync --locked)
        run: uv sync --locked

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      # `git config safe.directory` es el workaround de
      # https://github.com/actions/runner-images/issues/6775 (checkout dentro de contenedor).
      - name: Correr linters y checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run pre-commit run --all --show-diff-on-failure

  # ---------------------------------------------------------------------------
  # Humo de la imagen Docker (B-911): build real + Postgres de servicio. Reutiliza
  # `smoke-imagen.yml` (que tambien corre solo en PRs que tocan Dockerfile/scripts/...).
  # Misma condicion que `suite` pero SIN el corte de `push` normal: solo en el push que
  # CREA la rama (re-fork) y en dispatch `completo`; un push cualquiera no paga el build.
  # ---------------------------------------------------------------------------
  imagen:
    name: Smoke de la imagen
    if: ${{ (github.event_name == 'push' && github.event.created) || (github.event_name == 'workflow_dispatch' && inputs.alcance != 'rapido') }}
    uses: ./.github/workflows/smoke-imagen.yml

  # ---------------------------------------------------------------------------
  # Suite completa. Sin cobertura: el fork no la sube a ningun servicio externo (no
  # tiene el secreto que haria falta) y quitarla ahorra minutos de runner.
  # B-1005: la suite corre en cada push a stable/* porque ci_desplegable.py exige el
  # HEAD exacto; B-666 (ahorro de minutos) queda superada: el repo es publico.
  # (Antes solo corria en el push que crea la rama, en PR y en dispatch `completo`.)
  # El dispatch `rapido` sigue sin correrla. `linters` tiene la misma condicion (B-1270).
  # ---------------------------------------------------------------------------
  suite:
    name: Suite completa (17k tests)
    runs-on: ubuntu-latest
    container: python:3.12
    # B-1008: bajado de 60 a 30. La suite termina en ~12-20 min; si el proceso se cuelga
    # al salir, 30 min bastan para verlo sin quemar una hora de runner.
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.alcance != 'rapido' }}

    services:
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: saleor
          POSTGRES_USER: saleor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: valkey/valkey:8.1-alpine
        options: >-
          --health-cmd "valkey-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependencias de sistema
        run: |
          apt-get install -y libpq-dev

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.0.0
        with:
          enable-cache: true

      - name: Sincronizar el entorno (uv sync --locked)
        run: uv sync --locked

      # B-1008: la suite llegaba al 99 % y se colgaba sin resumen. `-ra` resume solo lo
      # que no pasa (fallos, errores, skips, xfail): B-1016 quito el `-rA` de diagnostico,
      # cuyo listado de ~17 900 PASSED tardaba >2 min en imprimirse y disparaba el watchdog
      # de salida en falso. `faulthandler_timeout` vuelca los stacks de todos los hilos si un
      # test pasa de 300 s.
      # `B1008_EXIT_WATCHDOG` arma (conftest.py) un volcado de stacks cada 120 s si el
      # proceso no sale tras terminar la sesion: `faulthandler_timeout` no cubre la salida.
      - name: Correr la suite (sin e2e)
        env:
          B1008_EXIT_WATCHDOG: "1"
        run: |
          uv run pytest \
            -m "not e2e" \
            -n logical \
            -ra \
            -o faulthandler_timeout=300 \
            --junitxml=junit/test-results.xml \
            -o junit_family=legacy

      # B-1024: vigila el margen del timeout por test (B-1019, 600 s). Avisa si el mas lento
      # pasa de la mitad y deja el top 5 en el resumen del job. Nunca rompe el job (exit 0).
      - name: Vigilar el test mas lento
        if: always()
        run: sh scripts/check-slowest-test.sh

      - name: Publicar resultados JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pytest
          path: junit/test-results.xml
