name: Sync with Saleor upstream

# ⚠️ `schedule` SOLO dispara desde la rama por defecto del repositorio.
# Este workflow vive en `stable/3.22`, y por eso esa es la rama por defecto de
# `aclicona/licona-saleor` (se cambió el 2026-08-22). Entre abril y agosto de 2026 la
# rama por defecto fue `main` y este workflow no corrió NI UNA SOLA VEZ: GitHub ni
# siquiera lo listaba (`gh workflow list` no lo mostraba y la API respondía
# "not found on the default branch"). Cuatro meses sin sincronizar y sin ningún aviso.
# Si alguien vuelve a poner `main` por defecto, esto se apaga en silencio otra vez.

on:
  schedule:
    # Cada lunes a las 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # ── Parches dentro del minor actual (3.22.x) ────────────────────────────────
  # Deliberadamente NO cruza a un minor nuevo: Saleor solo garantiza migraciones sin
  # downtime entre minors consecutivos, así que el salto de minor es una decisión
  # humana planificada, no un PR automático. De eso avisa el job `check-new-minor`.
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Explícito a propósito: sin `ref`, el checkout toma la rama por defecto.
          # Eso funciona hoy, pero ata el workflow a una configuración del repo que
          # ya falló una vez. Fijarla aquí hace el workflow correcto por sí mismo.
          ref: stable/3.22
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/saleor/saleor.git || true
          git fetch upstream --tags

      - name: Get latest stable tag in current minor series
        id: upstream_tag
        run: |
          # Only look for patches in the same minor (3.22.x) to enforce minor-by-minor upgrades
          CURRENT_MINOR=$(grep '^version' pyproject.toml | sed 's/version = "\([0-9]*\.[0-9]*\).*/\1/')
          LATEST=$(git tag -l "${CURRENT_MINOR}.*" --sort=-v:refname | grep -E "^${CURRENT_MINOR//./\\.}\.[0-9]+$" | head -1)
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
          echo "Current minor: $CURRENT_MINOR | Latest patch: $LATEST"

      - name: Check if PR already exists
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ Sin esto, `gh` resuelve el repo del FORK a su padre (`saleor/saleor`) y
          # opera contra el repo equivocado en silencio: `gh pr list` devolvía vacío
          # siempre —consultaba los PRs de Saleor— y `--label` fallaba con
          # "'upstream-sync' not found" porque buscaba la label allá (run 32610898534).
          # El mismo síntoma delató el problema en local: `gh run list` respondió con
          # una URL `api.github.com/repos/saleor/saleor/...`.
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh pr list --head "sync/upstream-${{ steps.upstream_tag.outputs.tag }}" --json number -q '.[0].number')
          echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT

      - name: Create sync branch and PR
        if: steps.check_pr.outputs.pr_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # ver nota en el paso anterior
          TAG: ${{ steps.upstream_tag.outputs.tag }}
        run: |
          set -uo pipefail

          BRANCH="sync/upstream-$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BASE_SHA=$(git rev-parse HEAD)
          git checkout -b "$BRANCH"

          # El merge de un fork con 19 parches de diferencia CONFLICTÚA — es lo normal,
          # no la excepción. Antes esto era `git merge ... || true`, y ese `|| true` era
          # el agujero: un merge conflictivo no deja commit, la rama quedaba idéntica a
          # la base, y `gh pr create` moría con "No commits between". Es exactamente lo
          # que pasó en el primer run real (2026-08-22, run 32610731180): conflictos en
          # AGENTS.md y uv.lock, y una rama vacía empujada como si nada.
          #
          # Los marcadores de conflicto se commitean A PROPÓSITO: es lo que convierte el
          # conflicto en un PR revisable, donde un humano resuelve con todo el contexto
          # a la vista. Un merge que falla en silencio no es "sin conflictos".
          # `--no-commit`: el merge deja todo en el índice sin commitear, para poder
          # sacar los workflows de upstream ANTES de que exista el commit.
          git merge --no-commit --no-ff "refs/tags/$TAG" || true

          # Los workflows de upstream NO se traen, y no es preferencia: el
          # `secrets.GITHUB_TOKEN` tiene PROHIBIDO empujar cambios bajo
          # `.github/workflows/`. GitHub rechaza el push entero con
          #   "refusing to allow a GitHub App to create or update workflow ...
          #    without `workflows` permission"
          # y no hay clave en `permissions:` que lo habilite — solo un PAT lo saltaría.
          # (Pasó en el run 32610898534 con `changelog-check.yml`.)
          #
          # Se descartan a propósito en vez de pedir un PAT: este fork no usa el CI de
          # upstream —despliega por Railway y tiene sus propios workflows—, así que no
          # se pierde nada en uso, y se evita una credencial de larga vida que caduca
          # en silencio. Si algún día hiciera falta un workflow de upstream, se trae a
          # mano. Nota: esto significa que `.github/workflows/` del fork NO sigue a
          # upstream. Es la decisión tomada el 2026-08-22, no un descuido.
          git checkout "$BASE_SHA" -- .github/workflows/ 2>/dev/null || true

          CONFLICTED=$(git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/')
          git add -A

          # Si el tag ya era ancestro —o lo único que traía eran workflows—, el merge no
          # aporta nada y no hay PR que abrir. Sin este corte, cada lunes sin novedades
          # se empuja una rama vacía y el job falla.
          if git diff --cached --quiet "$BASE_SHA"; then
            echo "El fork ya contiene $TAG (descontando .github/workflows/) — nada que sincronizar."
            exit 0
          fi

          if [ -n "$CONFLICTED" ]; then
            git commit -m "merge: upstream $TAG — CONFLICTOS SIN RESOLVER"
          else
            git commit -m "merge: upstream $TAG"
          fi

          git push origin "$BRANCH" --force

          {
            echo "Sync automático con \`saleor/saleor@$TAG\`."
            echo
            if [ -n "$CONFLICTED" ]; then
              echo "## ⚠️ Este PR tiene conflictos SIN RESOLVER"
              echo
              echo "Los marcadores de conflicto **están commiteados** en la rama, a propósito:"
              echo "es la única forma de que el conflicto sea revisable. **No mergear así.**"
              echo
              echo "Archivos en conflicto:"
              echo
              echo "$CONFLICTED"
              echo
              echo "Resolver sobre \`$BRANCH\`, commitear, y recién ahí sacar el PR de draft."
              echo
            fi
            echo "## Antes de mergear"
            echo
            echo "1. Revisar \`UPGRADE_NOTES.md\` — ahí está todo lo que este fork cambió"
            echo "   respecto a upstream, que es donde aparecen los conflictos."
            echo "2. Correr las migraciones contra una copia de la BD, no solo la suite."
            echo "3. Verificar que el esquema GraphQL no rompa el codegen del storefront."
          } > /tmp/pr-body.md

          # Draft cuando hay conflictos: impide que un merge accidental meta marcadores
          # de conflicto en `stable/3.22`.
          DRAFT=""
          TITLE="chore: sync upstream Saleor $TAG"
          if [ -n "$CONFLICTED" ]; then
            DRAFT="--draft"
            TITLE="chore: sync upstream Saleor $TAG — ⚠️ CON CONFLICTOS"
          fi

          gh pr create \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md \
            --base stable/3.22 \
            --head "$BRANCH" \
            --label "upstream-sync" \
            $DRAFT

  # ── Aviso de minor nuevo ────────────────────────────────────────────────────
  # El job `sync` es ciego a los minors por diseño, así que sin esto nadie se entera
  # de que salió 3.23 hasta que alguien lo mira a mano. Y como no se pueden saltar
  # minors, enterarse tarde no cuesta un upgrade: cuesta todos los intermedios.
  # No abre un PR — abre un issue. El salto de minor lo decide y lo planifica un humano.
  check-new-minor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable/3.22
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/saleor/saleor.git || true
          git fetch upstream --tags

      - name: Detectar el siguiente minor
        id: next
        run: |
          set -euo pipefail

          CURRENT=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "([0-9]+\.[0-9]+).*/\1/')
          MAJOR=${CURRENT%%.*}
          MINOR=${CURRENT##*.}
          NEXT="${MAJOR}.$((MINOR + 1))"

          # Último parche ESTABLE del siguiente minor. El filtro `[0-9]+$` descarta
          # rc/alpha: un 3.23.26-rc.1 no es motivo para planear un upgrade.
          LATEST=$(git tag -l "${NEXT}.*" --sort=-v:refname \
                   | grep -E "^${MAJOR}\.$((MINOR + 1))\.[0-9]+$" | head -1 || true)

          # Cuántos minors hay por delante en total. Uno es rutina; tres es deuda.
          ALL_MINORS=$(git tag -l --sort=-v:refname \
                       | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                       | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/' | sort -u -V)
          BEHIND=$(echo "$ALL_MINORS" | awk -v c="$CURRENT" 'seen {n++} $0 == c {seen=1} END {print n+0}')

          {
            echo "current=$CURRENT"
            echo "next=$NEXT"
            echo "latest=$LATEST"
            echo "behind=$BEHIND"
          } >> "$GITHUB_OUTPUT"

          echo "Fork en $CURRENT | siguiente minor: $NEXT (${LATEST:-aún no publicado}) | minors por delante: $BEHIND"

      - name: Abrir issue si el siguiente minor ya está publicado
        if: steps.next.outputs.latest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # ver nota en el job `sync`
          CURRENT: ${{ steps.next.outputs.current }}
          NEXT: ${{ steps.next.outputs.next }}
          LATEST: ${{ steps.next.outputs.latest }}
          BEHIND: ${{ steps.next.outputs.behind }}
        run: |
          set -euo pipefail

          TITLE="chore: Saleor ${NEXT} disponible — siguiente minor del fork"

          # Idempotencia: un issue por minor, no uno por lunes. Se busca por título
          # exacto entre los abiertos; si se cierra a mano, no vuelve a abrirse hasta
          # que el fork avance de minor y el título cambie.
          EXISTING=$(gh issue list --state open --label upstream-minor --limit 100 \
                     --json number,title \
                     | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Ya existe el issue #$EXISTING para ${NEXT} — nada que hacer."
            exit 0
          fi

          cat > /tmp/issue-body.md <<EOF
          El fork está en **${CURRENT}** y upstream ya publicó **${LATEST}**.
          Minors por delante en total: **${BEHIND}**.

          ## Por qué esto es un issue y no un PR

          Saleor solo garantiza migraciones sin downtime **entre minors consecutivos**. No se
          puede saltar de ${CURRENT} a un minor posterior directamente: hay que pasar por
          ${NEXT} primero. Por eso el salto de minor es una decisión humana planificada y no un
          merge automático — el job \`sync\` de este mismo workflow solo trae parches dentro de
          ${CURRENT}.x.

          Cuantos más minors se acumulen, más caro sale: no se paga un upgrade, se pagan todos
          los intermedios, cada uno con su tanda de migraciones.

          ## Qué hay que hacer

          1. Leer el changelog de upstream entre \`${CURRENT}\` y \`${LATEST}\`, con foco en
             migraciones y cambios de esquema GraphQL.
          2. Revisar \`UPGRADE_NOTES.md\` — ahí está todo lo que este fork cambió respecto a
             upstream, que es exactamente donde van a aparecer los conflictos.
          3. Rama de upgrade desde \`stable/${CURRENT}\`, merge de \`refs/tags/${LATEST}\`,
             resolver conflictos.
          4. Correr las migraciones contra una copia de la BD, no solo la suite.
          5. Verificar el storefront y las apps de pago contra la API nueva: el esquema GraphQL
             cambia entre minors y el codegen del storefront depende de él.
          6. Al terminar: actualizar \`version\` en \`pyproject.toml\`, renombrar la rama base a
             \`stable/${NEXT}\` y **cambiar la rama por defecto del repo** — si no, este
             workflow deja de correr (ver el comentario al inicio de \`sync-upstream.yml\`).

          ---
          _Abierto automáticamente por \`.github/workflows/sync-upstream.yml\`. Se reabre cada
          lunes mientras el fork siga en ${CURRENT}; ciérralo cuando el upgrade esté planificado._
          EOF

          gh issue create \
            --title "$TITLE" \
            --label "upstream-minor" \
            --body-file /tmp/issue-body.md
